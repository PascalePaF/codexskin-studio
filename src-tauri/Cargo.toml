[package]
name = "codexskin-studio"
version = "1.3.0"
description = "A local-first skin studio for the ChatGPT desktop app"
authors = ["CodexSkin Studio contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "codexskin_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
dirs = "6"
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.11.27", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tempfile = "3"
toml_edit = "0.25"
tungstenite = "0.21"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
