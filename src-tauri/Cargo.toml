[package]
name = "codexskin-studio"
version = "1.1.0"
description = "A local-first skin studio for the ChatGPT desktop app"
authors = ["CodexSkin Studio contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "codexskin_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tempfile = "3"
toml_edit = "0.25"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
